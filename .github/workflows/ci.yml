name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'mvp/**'
      - 'feature/**'
      - 'fix/**'

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

# One run per PR (or per branch for pushes); a new push cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format, lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: omero
          POSTGRES_PASSWORD: omero
          POSTGRES_DB: omero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omero -d omero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No `version` input: pnpm/action-setup reads it from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Throwaway values for the API config. The key is random per run, masked in logs,
      # and only ever encrypts test data that is discarded with the service containers.
      - name: Prepare test environment
        run: |
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/media"
          echo "MEDIA_DIR=$RUNNER_TEMP/media" >> "$GITHUB_ENV"

      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test
          PUBLIC_BASE_URL: http://localhost:3000
          TEST_DATABASE_URL: postgres://omero:omero@localhost:5432/omero_test
          TEST_REDIS_URL: redis://localhost:6379/1
          DATABASE_URL: postgres://omero:omero@localhost:5432/omero_test
          REDIS_URL: redis://localhost:6379/1

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the commits of a pull request through the API.
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned so CI matches the config syntax in .gitleaks.toml (needs >= 8.25).
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_CONFIG: .gitleaks.toml
          # Comments on PRs would need `pull-requests: write`; findings show in the job log and summary.
          GITLEAKS_ENABLE_COMMENTS: false
